groups:
  - name: system-alerts
    rules:
      - alert: HighCPUUsage
        expr: |
          100 * (1 - avg by (instance) (
            rate(node_cpu_seconds_total{mode="idle"}[5m])
          )) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage detected
          description: CPU usage has exceeded 80% for one minute.
